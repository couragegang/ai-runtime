micronaut:
  application:
    name: ai-runtime
  server:
    port: 8083
    context-path: /v1/ai
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
    binders:
      jvm:
        enabled: true
      web:
        enabled: true
        server:
          percentiles: [0.5, 0.95, 0.99]
          histogram: true
      uptime:
        enabled: true
      processor:
        enabled: true

endpoints:
  health:
    enabled: true
    sensitive: false
  metrics:
    enabled: false
  prometheus:
    enabled: true
    sensitive: false

datasources:
  default:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:platform}
    driver-class-name: org.postgresql.Driver

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration

ai:
  orchestrator: ${AI_ORCHESTRATOR:legacy}
  internal-api-key: ${AI_INTERNAL_API_KEY:dev-internal-key}
  n8n:
    enabled: ${AI_N8N_ENABLED:false}
    webhook-url: ${N8N_WEBHOOK_URL:http://localhost:5678/webhook/chat-orchestrator}
    wait-timeout-seconds: ${AI_N8N_WAIT_TIMEOUT_SECONDS:90}
  llm-provider: ${LLM_PROVIDER:stub}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    thinking-type: ${DEEPSEEK_THINKING_TYPE:disabled}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}
  policy-service:
    enabled: ${POLICY_SERVICE_ENABLED:true}
    base-url: ${POLICY_SERVICE_URL:http://localhost:8085/v1/policy}
    internal-api-key: ${POLICY_INTERNAL_API_KEY:dev-internal-key}
  audit-service:
    enabled: ${AUDIT_SERVICE_ENABLED:true}
    base-url: ${AUDIT_SERVICE_URL:http://localhost:8086/v1/audit}
    internal-api-key: ${AUDIT_INTERNAL_API_KEY:dev-internal-key}
  mcp-service:
    enabled: ${MCP_SERVICE_ENABLED:true}
    base-url: ${MCP_SERVICE_URL:http://localhost:8081/v1/mcp}
    internal-api-key: ${MCP_INTERNAL_API_KEY:dev-internal-key}
